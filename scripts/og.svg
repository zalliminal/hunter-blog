<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- subtle grid pattern -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <path d="M0 100 H1200 M0 200 H1200 M0 300 H1200 M0 400 H1200 M0 500 H1200"/>
    <path d="M100 0 V630 M200 0 V630 M300 0 V630 M400 0 V630 M500 0 V630 M600 0 V630 M700 0 V630 M800 0 V630 M900 0 V630 M1000 0 V630 M1100 0 V630"/>
  </g>

  <!-- accent bar -->
  <rect x="100" y="80" width="80" height="6" rx="3" fill="url(#accent)"/>

  <!-- Persian brand name (large) -->
  <text x="100" y="320" font-family="Tahoma, Arial, sans-serif" font-size="180" font-weight="700" fill="#ffffff" direction="rtl">کاولبز</text>

  <!-- Latin brand subtitle -->
  <text x="100" y="400" font-family="Inter, -apple-system, sans-serif" font-size="48" font-weight="600" fill="#fbbf24" letter-spacing="2">KavLabs</text>

  <!-- tagline -->
  <text x="100" y="455" font-family="Inter, -apple-system, sans-serif" font-size="28" fill="#9ca3af">Security research notes & writeups</text>

  <!-- language hint -->
  <text x="100" y="540" font-family="Inter, -apple-system, sans-serif" font-size="20" fill="#6b7280">English & Farsi · by Parham Forati & Zal</text>

  <!-- corner mark -->
  <g transform="translate(1080, 80)">
    <circle cx="20" cy="20" r="8" fill="#fbbf24"/>
    <circle cx="20" cy="20" r="20" fill="none" stroke="#fbbf24" stroke-opacity="0.3" stroke-width="2"/>
  </g>
</svg>
